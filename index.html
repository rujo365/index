<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital 24 - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-msg {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Digital 24 Login</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="userId">User ID</label>
            <input type="text" id="userId" required placeholder="Enter your User ID">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter your Password">
        </div>
        <button type="submit">Login</button>
        <div id="error" class="error-msg"></div>
    </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // আপনার ফায়ারবেস কনফিগারেশন অবজেক্ট
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Login Form Handling
  document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const userId = document.getElementById('userId').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error');
      errorDiv.innerText = ""; // ক্লিয়ার এরর

      // এখানে আপনি যদি ইমেইল ফরম্যাট ছাড়া শুধু User ID দিয়ে লগইন করাতে চান, 
      // তবে ফায়ারবেস অথেন্টিকেশনের নিয়ম অনুযায়ী এটিকে ইমেইল ফরম্যাটে কনভার্ট করে নিতে পারেন।
      const email = userId.includes('@') ? userId : `${userId}@digital24.com`;

      signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
              // সফল লগইন
              alert("Login successful!");
              window.location.href = "dashboard.html"; // সফল হলে ড্যাশবোর্ডে নিয়ে যাবে
          })
          .catch((error) => {
              // ব্যর্থ লগইন
              errorDiv.innerText = "Invalid User ID or Password.";
              console.error(error.message);
          });
  });
</script>

</body>
</html>
